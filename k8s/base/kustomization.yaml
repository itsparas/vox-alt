apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: voxreception

resources:
  - namespace.yaml
  - backend.yaml
  - frontend.yaml
  - ingress.yaml

commonLabels:
  app.kubernetes.io/name: voxreception
  app.kubernetes.io/managed-by: kustomize

configMapGenerator:
  - name: voxreception-config
    behavior: merge
    literals:
      - NODE_ENV=production

# Image customization (override in overlays)
images:
  - name: voxreception/backend
    newTag: latest
  - name: voxreception/frontend
    newTag: latest
