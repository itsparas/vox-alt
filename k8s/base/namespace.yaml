apiVersion: v1
kind: Namespace
metadata:
  name: voxreception
  labels:
    app.kubernetes.io/name: voxreception
---
# ConfigMap for non-sensitive configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: voxreception-config
  namespace: voxreception
data:
  NODE_ENV: "production"
  BACKEND_PORT: "3001"
  FRONTEND_PORT: "3000"
  CORS_ORIGIN: "*"
---
# Secret for sensitive data (values should be base64 encoded)
# In production, use a secret management solution like Vault or sealed-secrets
apiVersion: v1
kind: Secret
metadata:
  name: voxreception-secrets
  namespace: voxreception
type: Opaque
stringData:
  DATABASE_URL: "postgresql://user:password@postgres:5432/voxreception"
  REDIS_URL: "redis://:password@redis:6379"
  JWT_SECRET: "your-jwt-secret"
  JWT_REFRESH_SECRET: "your-refresh-secret"
  LIVEKIT_API_KEY: "your-livekit-key"
  LIVEKIT_API_SECRET: "your-livekit-secret"
  STRIPE_SECRET_KEY: ""
  STRIPE_WEBHOOK_SECRET: ""
  OPENAI_API_KEY: ""
  DEEPGRAM_API_KEY: ""
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""
